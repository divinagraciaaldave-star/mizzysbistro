/* ===== Split bill ===== */
const units=t=>{const u=[];t.lines.forEach((l,li)=>{for(let k=0;k<l.q;k++)u.push({li,seat:l.seat||1})});return u};
const guestOpts=(n,sel)=>[...Array(n)].map((_,g)=>`<option value="${g+1}" ${sel===g+1?'selected':''}>Guest ${g+1}</option>`).join('');
function splitModal(){const t=tickets[cur];if(!t||!t.lines.length)return toast('Add items before splitting.');SPL={mode:(t.ns||1)>1?'seat':'item',n:2,asg:[],hg:{}};paintSplit()}
function setN(n){SPL.n=n;SPL.asg=SPL.asg.map(a=>Math.min(a||1,n));Object.keys(SPL.hg).forEach(k=>SPL.hg[k]=Math.min(SPL.hg[k],n));paintSplit()}
function paintSplit(){const t=tickets[cur],S=SPL,c=calc(t),u=units(t);
const tabs=[['seat','By seat'],['item','By item'],['even','Evenly']].map(x=>`<button class="chip ${S.mode===x[0]?'on':''}" onclick="SPL.mode='${x[0]}';paintSplit()">${x[1]}</button>`).join('');
const counter=(lo,hi)=>`<div class="row" style="margin-bottom:6px"><span class="mut">Guests</span>${[...Array(hi-lo+1)].map((_,i)=>`<button class="chip ${S.n===lo+i?'on':''}" onclick="setN(${lo+i})">${lo+i}</button>`).join('')}</div>`;
let body='';
if(S.mode==='seat'){const seats=[...new Set(u.map(x=>x.seat))].sort((a,b)=>a-b);
body=seats.length<2?'<p class="mut">Only one seat has items. Put items on different seats with the Seat buttons on the ticket, or split by item.</p>':`<p class="mut">Each seat gets its own bill and official receipt.</p>${seats.map(s=>`<div class="line"><span class="n">Seat ${s}<small>${u.filter(x=>x.seat===s).length} items${(t.sp||[]).some(h=>h.seat===s)?' · SC/PWD':''}</small></span>${m$(t.lines.filter(l=>(l.seat||1)===s).reduce((a,l)=>a+l.p*l.q,0))}</div>`).join('')}<button class="p" style="margin-top:10px" onclick="doSplit()">Create ${seats.length} bills</button>`}
else if(S.mode==='item'){body=`${counter(2,6)}${(t.sp||[]).map((h,hi)=>`<div class="line"><span class="n">${h.type==='SC'?'Senior':'PWD'} · ${esc(h.name)}<small>Discount goes on this guest's bill</small></span><select style="width:auto" onchange="SPL.hg[${hi}]=+this.value">${guestOpts(S.n,S.hg[hi]||1)}</select></div>`).join('')}${u.map((x,i)=>{const l=t.lines[x.li];return `<div class="line"><span class="n">${l.n}<small>${l.mod||''} ${m$(l.p)}</small></span><select style="width:auto" onchange="SPL.asg[${i}]=+this.value;splTot()">${guestOpts(S.n,S.asg[i]||1)}</select></div>`}).join('')}<div id="sptot" class="tot" style="margin-top:8px"></div><button class="p" style="margin-top:10px" onclick="doSplit()">Create bills</button>`}
else{body=`${counter(2,8)}<p>Total <b>${m$(c.due)}</b> · about <b>${m$(c.due/S.n)}</b> each</p><p class="mut">One official receipt for the whole bill. Each guest pays in turn and can use a different method.</p><button class="p" onclick="doSplit()">Start split payment</button>`}
modal(`<h2>Split bill · ${esc(t.k)}</h2><div class="row" style="margin-bottom:8px">${tabs}</div>${body}<div class="row" style="margin-top:12px"><button onclick="closeModal()">Cancel</button></div>`);if(S.mode==='item')splTot()}
function splTot(){const t=tickets[cur],S=SPL,sum={};units(t).forEach((x,i)=>{const g=S.asg[i]||1;sum[g]=(sum[g]||0)+t.lines[x.li].p});const e=$('#sptot');if(e)e.innerHTML=[...Array(S.n)].map((_,g)=>`<div><span>Guest ${g+1} (before discounts)</span>${m$(sum[g+1]||0)}</div>`).join('')}
function doSplit(){const t=tickets[cur],S=SPL,u=units(t);if(S.mode==='even'){const n=S.n;SPL=null;closeModal();pendSplit=n;return checkout()}

const made=ids.map((id,bi)=>{const m={};u.forEach((x,i)=>{if(g[i]===id)m[x.li]=(m[x.li]||0)+1});
const ch={k:t.k+' · '+(S.mode==='seat'?'Seat ':'Guest ')+id,type:t.type,lines:Object.keys(m).map(li=>({...t.lines[li],q:m[li],seat:1})),staff:t.staff,parent:t.parent||t.k,seat:1,ns:1};
ch.sp=(t.sp||[]).filter((h,hi)=>S.mode==='seat'?(h.seat===id||(h.seat===0&&bi===0)):(S.hg[hi]||1)===id).slice(0,1).map(h=>({...h,seat:0}));
if(bi===0){if(t.cust)ch.cust=t.cust;if(t.rp)ch.rp=t.rp;if(t.cr)ch.cr=t.cr}
if(t.d&&(t.d.t==='%'||bi===0))ch.d={...t.d};if(t.zr)ch.zr=t.zr;if(t.note)ch.note=t.note;return ch});
delete tickets[t.k];made.forEach(x=>tickets[x.k]=x);cur=made[0].k;SPL=null;log('other','Bill split',t.k+' into '+made.length+' bills ('+S.mode+')',0);closeModal();render();toast('Split into '+made.length+' bills.')}

/* ===== Menu management ===== */
function vMenu(){const items=menu.filter(i=>(mc==='All'||i.c===mc)&&i.n.toLowerCase().includes(mq.toLowerCase())&&(mf==='all'||(mf==='hid'&&i.hid)||(mf==='86'&&is86(i))||(mf==='low'&&crit(i)))),n86=menu.filter(is86).length,nlow=menu.filter(crit).length,nh=menu.filter(i=>i.hid).length;
const row=i=>{const o=is86(i),lo=crit(i);return `<div class="mi ${lo?'crit':''} ${i.hid?'hid':''}"><div class="n"><b>${i.e} ${i.n}</b> ${o?`<span class="tag b">86'd</span>`:''}${i.hid?'<span class="tag">Hidden</span>':''}${lo?`<span class="tag b">${i.s<=0?'Out of stock':'Critical'}</span>`:''}<small class="mut" style="display:block">${i.c} · ${m$(i.p)} · ${i.s} in stock (critical at ${par(i)})</small></div><div class="row"><button onclick="mgr(()=>priceModal(${i.id}))">Price</button><button class="${o?'p':''}" onclick="toggle86(${i.id})">${o?'Back in':'86'}</button><button onclick="toggleHide(${i.id})">${i.hid?'Show':'Hide'}</button><button onclick="mgr(()=>itemModal(${i.id}))">Edit</button></div></div>`};
return `<div class="card"><div class="row" style="justify-content:space-between"><h2>Menu items</h2><div class="row"><button class="p" onclick="mgr(()=>itemModal(0))">+ Add item</button><button onclick="mgr(catModal)">Categories</button>${n86?'<button onclick="clear86()">Clear 86 list</button>':''}</div></div>
<p class="mut">86 means out for the day and clears itself tomorrow. Items at or below their critical level turn light red. Adding, editing and pricing need an admin PIN and go in the audit log.</p>
<div class="row" style="margin:8px 0">${['All',...catList].map(x=>`<button class="chip ${mc===x?'on':''}" onclick="mc='${x}';render()">${x}</button>`).join('')}</div>
<div class="row">${[['all','All'],['low','Low ('+nlow+')'],['86',"86'd ("+n86+')'],['hid','Hidden ('+nh+')']].map(x=>`<button class="chip ${mf===x[0]?'on':''}" onclick="mf='${x[0]}';render()">${x[1]}</button>`).join('')}<input id="mq" placeholder="Search items" value="${esc(mq)}" oninput="mq=this.value;render();const s=$('#mq');s.focus();s.setSelectionRange(mq.length,mq.length)" style="flex:1;min-width:120px"></div>
${items.map(row).join('')||'<p class="mut">No items match.</p>'}</div>`}
function toggle86(id){const i=menu.find(x=>x.id===id);i.x86=is86(i)?null:new Date().toDateString();log('other',is86(i)?"Marked 86'd":'Back on the menu',i.n,0);render()}
function clear86(){const l=menu.filter(is86);l.forEach(i=>i.x86=null);log('other','Cleared 86 list',l.length+' items',0);render()}
function toggleHide(id){const i=menu.find(x=>x.id===id);i.hid=!i.hid;log('other',i.hid?'Item hidden':'Item shown',i.n,0);render()}
function priceModal(id){const i=menu.find(x=>x.id===id);modal(`<h2>Change price</h2><p class="mut">${i.e} ${i.n} · now ${m$(i.p)} (VAT included)</p><input id="np" type="number" step="0.01" min="0" inputmode="decimal" value="${i.p}"><div class="row" style="margin-top:10px"><button class="p" onclick="savePrice(${id})">Save price</button><button onclick="closeModal()">Cancel</button></div>`)}
function savePrice(id){const i=menu.find(x=>x.id===id),v=r2(+$('#np').value);if(!(v>0))return toast('Enter a price above zero.');if(v===i.p)return closeModal();log('price','Price change',i.n+' '+m$(i.p)+' to '+m$(v),v-i.p);i.p=v;closeModal();render()}
function itemModal(id){const it=id?menu.find(x=>x.id===id):{n:'',c:catList[0]||'',p:'',e:'🍽️',s:0,o:'',par:5};
modal(`<h2>${id?'Edit item':'Add item'}</h2><label style="${fl}">Name</label><input id="f_n" maxlength="40" value="${esc(it.n)}"><div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label style="${fl}">Emoji</label><input id="f_e" maxlength="8" value="${esc(it.e)}"></div><div style="flex:1"><label style="${fl}">Price (VAT incl.)</label><input id="f_p" type="number" step="0.01" min="0" inputmode="decimal" value="${it.p}"></div></div>
<label style="${fl}">Category</label><select id="f_c" onchange="$('#f_nc').style.display=this.value==='__new'?'block':'none'">${catList.map(c=>`<option ${c===it.c?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new">New category…</option></select><input id="f_nc" placeholder="New category name" maxlength="20" style="display:none;margin-top:6px">
<div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label style="${fl}">Stock on hand</label><input id="f_s" type="number" min="0" step="1" value="${it.s}"></div><div style="flex:1"><label style="${fl}">Critical at or below</label><input id="f_g" type="number" min="0" step="1" value="${par(it)}"></div></div>
<label style="${fl}">Options when ordering</label><select id="f_o"><option value="" ${!it.o?'selected':''}>None</option>${Object.entries(MLBL).map(([k,v])=>`<option value="${k}" ${it.o===k?'selected':''}>${v}</option>`).join('')}</select>
<div class="row" style="margin-top:14px"><button class="p" onclick="saveItem(${id})">${id?'Save changes':'Add item'}</button><button onclick="closeModal()">Cancel</button></div>`)}
function saveItem(id){const n=String($('#f_n').value).replace(/[<>&`]/g,'').trim(),e=clean($('#f_e').value)||'🍽️',p=r2(+$('#f_p').value),s=Math.floor(+$('#f_s').value),g=Math.floor(+$('#f_g').value),o=$('#f_o').value;let c=$('#f_c').value;
if(c==='__new'){c=clean($('#f_nc').value);if(!c)return toast('Enter the new category name.')}
if(!n)return toast('Enter an item name.');if(!(p>0))return toast('Enter a price above zero.');if(!(s>=0)||!(g>=0))return toast('Stock numbers cannot be negative.');
if(menu.some(x=>x.id!==id&&x.n.toLowerCase()===n.toLowerCase()))return toast('An item with that name already exists.');
if(!catList.includes(c))catList.push(c);
if(id){const it=menu.find(x=>x.id===id),pc=it.p!==p,old=it.p;Object.assign(it,{n,e,c,p,s,par:g,o});if(pc)log('price','Price change',n+' '+m$(old)+' to '+m$(p)+' (item edited)',p-old);else log('other','Item edited',n,0)}
else{menu.push({id:Math.max(0,...menu.map(x=>x.id))+1,n,e,c,p,s,par:g,o});log('other','Item added',n+' · '+m$(p)+' · '+c,0)}
closeModal();render();toast(id?'Saved.':'Item added.')}
function catModal(){modal(`<h2>Categories</h2><p class="mut">Rename a category or add one. A category can be removed once it has no items.</p>${catList.map((c,i)=>{const n=menu.filter(x=>x.c===c).length;return `<div class="row" style="margin:6px 0;flex-wrap:nowrap"><input id="cr${i}" value="${esc(c)}" maxlength="20"><button onclick="renCat(${i})">Rename</button><button class="d" ${n?'disabled title="Has items"':''} onclick="delCat(${i})">Remove</button></div>`}).join('')}<div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="cnew" placeholder="New category" maxlength="20"><button class="p" onclick="addCat()">Add</button></div><div style="margin-top:12px"><button onclick="closeModal();render()">Done</button></div>`)}
function renCat(i){const v=clean($('#cr'+i).value);if(!v)return toast('Enter a name.');if(catList.some((x,j)=>j!==i&&x.toLowerCase()===v.toLowerCase()))return toast('That category already exists.');const old=catList[i];if(v===old)return;menu.forEach(x=>{if(x.c===old)x.c=v});catList[i]=v;if(cat===old)cat=v;if(mc===old)mc=v;log('other','Category renamed',old+' to '+v,0);catModal()}
function delCat(i){const old=catList[i];if(menu.some(x=>x.c===old))return toast('Move or hide its items first.');if(catList.length<=1)return toast('Keep at least one category.');catList.splice(i,1);if(cat===old)cat='All';if(mc===old)mc='All';log('other','Category removed',old,0);catModal()}
function addCat(){const v=clean($('#cnew').value);if(!v)return toast('Enter a name.');if(catList.some(x=>x.toLowerCase()===v.toLowerCase()))return toast('That category already exists.');catList.push(v);log('other','Category added',v,0);catModal()}

/* ===== Settings (receipt and BIR details) ===== */
function vSettings(){const f=(k,l,ph)=>`<label style="${fl}">${l}</label><input id="cf_${k}" value="${esc(cfg[k]||'')}" placeholder="${ph}" maxlength="80" autocomplete="off">`,left=cfg.serTo?Math.max(0,cfg.serTo-orSeq):0;
return `<div class="card" style="max-width:560px"><h2>Receipt and BIR details</h2><p class="mut">These print on every official receipt and shift report. Copy them from your BIR registration, permit to use and authority to print.</p>${f('tin','TIN (VAT registered)','000-000-000-00000')}${f('reg','Registered name (optional)','Registered business name')}${f('min','Machine ID no. (MIN)','')}${f('sn','POS serial no.','')}${f('ptu','Permit to use (PTU) no.','')}${f('atp','Authority to print (ATP) no.','')}
<div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label style="${fl}">OR series from</label><input id="cf_serFrom" type="number" min="1" value="${cfg.serFrom}"></div><div style="flex:1"><label style="${fl}">OR series to</label><input id="cf_serTo" type="number" min="0" value="${cfg.serTo||''}"></div></div>
<label style="${fl}">Service charge % (dine-in)</label><input id="cf_svc" type="number" min="0" max="30" step="0.5" value="${cfg.svc}">${f('sup','POS supplier line (name, TIN, accreditation no.)','Prints at the bottom of receipts')}
<p class="mut">Next OR number: <b>${fmtOR(orSeq+1)}</b>${cfg.serTo?' · '+left+' left in this series':''}</p><button class="p" onclick="mgr(saveCfg)">Save details</button></div>
<div class="card" style="max-width:560px;margin-top:10px"><h3>How the tax lines work</h3><p class="mut">Menu prices include 12% VAT. A Senior or PWD discount removes the VAT first, then takes 20% off, and that sale prints under VAT-exempt. Zero-rated sales need an admin PIN. The OR number goes up by one on every sale, and checkout stops when the series runs out.</p></div>${pinCard()}`}
function saveCfg(){const g=k=>($('#cf_'+k).value||'').trim(),tin=g('tin'),t=tin?fmtTin(tin):'';if(t===null)return toast('TIN needs 9 to 14 digits.');
const from=Math.max(1,Math.floor(+g('serFrom')||1)),to=Math.floor(+g('serTo')||0),svc=+g('svc');if(to&&to<from)return toast('Series end must be after the start.');if(to&&to<orSeq)return toast('Series end is below the last OR already issued.');if(!(svc>=0&&svc<=30))return toast('Service charge must be 0 to 30.');
const nv={tin:t,reg:g('reg'),min:g('min'),sn:g('sn'),ptu:g('ptu'),atp:g('atp'),serFrom:from,serTo:to,svc,sup:g('sup')},ch=Object.keys(nv).filter(k=>String(nv[k])!==String(cfg[k]));
if(!ch.length)return toast('No changes to save.');cfg=nv;if(orSeq<from-1)orSeq=from-1;log('other','Receipt and BIR details changed',ch.join(', '),0);render();toast('Saved.')}
function net(){const o=navigator.onLine;$('#net').className='dot'+(o?'':' off');$('#netl').textContent=o?'Online':'Offline';$('#netl').className=o?'hs':''}
addEventListener('online',net);addEventListener('offline',net);loadPins();load();net();render();
if(DISP){setInterval(()=>{load();render()},1000);const beat=()=>{try{bc&&bc.postMessage({t:'hb'})}catch(e){}};beat();setInterval(beat,2000);try{bc&&bc.postMessage({t:'ask'})}catch(e){}}else{setInterval(()=>{updateBadge();if(cdsFull)paintCf()},1500);if(!GUEST)setInterval(checkLock,5000)}
</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = "https://dgziewmbrpfhtvzipfir.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnemlld21icnBmaHR2emlwZmlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjY2NjcsImV4cCI6MjEwNzA0MjY2N30.W7cvY88x9XcOHkBUTQgSGz7StCyAh4AbBCrBz7afBbc";
  const { createClient } = window.supabase;
  const supabase = createClient(supabaseUrl, supabaseKey);

  const menuList = document.getElementById("menuList");
  const orderList = document.getElementById("orderList");
  const orderSummary = document.getElementById("orderSummary");
  const recentOrders = document.getElementById("recentOrders");
  const placeOrderButton = document.getElementById("placeOrderButton");
  
  let currentOrder = [];

  function formatCurrency(value) {
    return Number(value || 0).toFixed(2);
  }

  async function seedSampleMenu() {
    const { data, error } = await supabase
      .from("menu_items")
      .select("*");

    if (!error && (!data || data.length === 0)) {
      const sampleMenu = [
        { name: "Burger", price: 120.00, category: "Main", stock: 20, is_available: true },
        { name: "Fries", price: 60.00, category: "Side", stock: 30, is_available: true },
        { name: "Coke", price: 40.00, category: "Drinks", stock: 25, is_available: true },
        { name: "Pizza", price: 180.00, category: "Main", stock: 15, is_available: true }
      ];

      await supabase.from("menu_items").insert(sampleMenu);
      loadMenu();
    } else {
      loadMenu();
    }
  }

  async function loadMenu() {
    const { data } = await supabase
      .from("menu_items")
      .select("*")
      .order("category", { ascending: true });

    if (!menuList || !data) return;
    menuList.innerHTML = "";

    data.forEach(item => {
      const card = document.createElement("div");
      card.style.cssText = "background: white; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin: 8px 0; display: flex; justify-content: space-between;";
      card.innerHTML = `
        <div>
          <strong>${item.name}</strong><br>
          <small>${item.category}</small>
        </div>
        <div>
          <span>₱${formatCurrency(item.price)}</span><br>
          <button type="button" data-item-id="${item.id}" data-item-name="${item.name}" data-item-price="${item.price}" style="padding: 5px 10px; background: #1f7a8c; color: white; border: none; border-radius: 5px; cursor: pointer;">Add</button>
        </div>
      `;
      menuList.appendChild(card);
    });

    document.querySelectorAll("[data-item-id]").forEach(button => {
      button.addEventListener("click", () => {
        const itemId = button.dataset.itemId;
        const itemName = button.dataset.itemName;
        const itemPrice = Number(button.dataset.itemPrice);

        const existing = currentOrder.find(x => x.itemId === itemId);
        if (existing) {
          existing.quantity += 1;
        } else {
          currentOrder.push({ itemId, itemName, itemPrice, quantity: 1 });
        }

        renderCurrentOrder();
      });
    });
  }

  function renderCurrentOrder() {
    if (!orderList || !orderSummary) return;
    orderList.innerHTML = "";
    let total = 0;

    currentOrder.forEach(item => {
      const subtotal = item.itemPrice * item.quantity;
      total += subtotal;
      const row = document.createElement("div");
      row.style.cssText = "display: flex; justify-content: space-between; margin: 8px 0;";
      row.innerHTML = `<span>${item.itemName} x${item.quantity}</span><span>₱${formatCurrency(subtotal)}</span>`;
      orderList.appendChild(row);
    });

    orderSummary.textContent = `Total: ₱${formatCurrency(total)}`;
  }

  async function placeOrder() {
    if (currentOrder.length === 0) {
      alert("Please add at least one item.");
      return;
    }

    const total = currentOrder.reduce((sum, item) => sum + (item.itemPrice * item.quantity), 0);

    const { data: orderData, error: orderError } = await supabase
      .from("orders")
      .insert([{ total: total, status: "pending" }])
      .select()
      .single();

    if (orderError) {
      alert("Failed to place order.");
      return;
    }

    const orderItems = currentOrder.map(item => ({
      order_id: orderData.id,
      menu_item_id: item.itemId,
      item_name: item.itemName,
      quantity: item.quantity,
      unit_price: item.itemPrice
    }));

    await supabase.from("order_items").insert(orderItems);
    await supabase.from("sales").insert([{ order_id: orderData.id, total: total }]);

    currentOrder = [];
    renderCurrentOrder();
    loadOrders();
    alert("Order placed successfully!");
  }

  async function loadOrders() {
    const { data } = await supabase
      .from("orders")
      .select("*, order_items(*)")
      .order("created_at", { ascending: false })
      .limit(10);

    if (!recentOrders) return;
    recentOrders.innerHTML = "";

    if (!data || data.length === 0) {
      recentOrders.innerHTML = "<p>No orders yet.</p>";
      return;
    }

    data.forEach(order => {
      const item = document.createElement("div");
      item.style.cssText = "background: white; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin: 8px 0;";
      const itemsText = (order.order_items || []).map(i => `${i.item_name} x${i.quantity}`).join(", ");
      item.innerHTML = `
        <strong>Order:</strong> ${new Date(order.created_at).toLocaleString()}<br>
        <strong>Status:</strong> ${order.status}<br>
        <strong>Total:</strong> ₱${formatCurrency(order.total)}<br>
        <small>${itemsText}</small>
      `;
      recentOrders.appendChild(item);
    });
  }

  async function subscribeToUpdates() {
    supabase
      .channel("orders-sync")
      .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, () => loadOrders())
      .on("postgres_changes", { event: "*", schema: "public", table: "order_items" }, () => loadOrders())
      .subscribe();
  }

  document.addEventListener("DOMContentLoaded", async () => {
    await seedSampleMenu();
    await loadOrders();
    subscribeToUpdates();
    if (placeOrderButton) placeOrderButton.addEventListener("click", placeOrder);
  });
</script>
